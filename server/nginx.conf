# DIP Studio – add inside the dipstudio.ba `server { … }` block, before the WordPress
# `location / { try_files … }` rule. Equivalent of apache-root.htaccess.

# Old staging install → 410 Gone (audit checklist #1).
location ~* ^/stagg?ing(/|$) {
    add_header X-Robots-Tag "noindex" always;
    return 410;
}

# Date-prefixed duplicate blog URLs → root /%postname%/ (audit checklist #3).
rewrite "^/[0-9]{4}/[0-9]{2}/[0-9]{2}/([^/]+)/?$" /$1/ permanent;
