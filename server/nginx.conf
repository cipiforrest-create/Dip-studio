# DIP Studio – add inside the dipstudio.ba `server { … }` block, before the WordPress
# `location / { try_files … }` rule. Equivalent of apache-root.htaccess.

# /stagging/ is a separate staging install: keep it working, but out of Google.
location ^~ /stagging/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ /stagging/index.php?$args;
}

# Date-prefixed duplicate blog URLs → root /%postname%/.
rewrite "^/[0-9]{4}/[0-9]{2}/[0-9]{2}/([^/]+)/?$" /$1/ permanent;
